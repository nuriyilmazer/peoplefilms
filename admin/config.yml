backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "works"
    label: "Works"
    folder: "content/works"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Vimeo URL", name: "vimeo_url", widget: "string", hint: "Örn: https://vimeo.com/1196732175"}
