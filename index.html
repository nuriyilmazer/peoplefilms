        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            color: #f4f4f4;

            font-family:

                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overflow-x: hidden;
            line-height: 1.6;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 30px 50px;

            border-bottom: 1px solid #1a1a1a;

            background: #0b0b0b;
        }

        .logo {
            font-size: 1.1rem;
            letter-spacing: 1.5px;

            color: #fff;
            text-decoration: none;

            font-weight: 500;
        }

        nav a {
            color: #888;
            text-decoration: none;

            margin-left: 30px;

            font-size: 0.85rem;

            text-transform: uppercase;
            letter-spacing: 1px;

            transition: color 0.3s;
        }

        nav a:hover {
            color: #fff;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;

            padding: 100px 20px 80px;

            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 1.4rem;

            font-weight: 300;

            line-height: 1.6;

            letter-spacing: -0.3px;

            color: #e0e0e0;
        }


        /* =========================
           GRID
        ========================= */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 40px;

            padding:
                0 50px 100px;

            max-width: 1600px;

            margin: 0 auto;
        }


        /* =========================
           VIDEO CARD
        ========================= */

        .video-card {
            width: 100%;

            min-width: 0;
        }


        /* =========================
           MEDIA BOX

           IMPORTANT:
           EVERY SINGLE CARD
           HAS EXACTLY THE SAME
           16:9 DIMENSIONS
        ========================= */

        .media-box {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background: #111;

            cursor: pointer;
        }


        /* =========================
           THUMBNAIL
        ========================= */

        .thumbnail {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.6s ease,
                filter 0.4s ease;
        }


        /* =========================
           HOVER
        ========================= */

        .media-box:hover .thumbnail {
            transform: scale(1.025);

            filter: brightness(0.65);
        }


        /* =========================
           WATCH TEXT
        ========================= */

        .watch {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            font-size: 0.8rem;

            letter-spacing: 2px;

            text-transform: uppercase;

            opacity: 0;

            transition: opacity 0.3s ease;

            pointer-events: none;
        }

        .media-box:hover .watch {
            opacity: 1;
        }


        /* =========================
           VIMEO PLAYER
        ========================= */

        .media-box iframe {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: 0;

            z-index: 5;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 60px 50px;

            color: #555;

            font-size: 0.8rem;

            border-top: 1px solid #1a1a1a;

            background: #090909;

            letter-spacing: 0.5px;
        }


        /* =========================
           TABLET
        ========================= */

        @media(max-width: 1100px) {

            .grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 768px) {

            header {
                padding: 20px;
            }

            .logo {
                font-size: 1rem;
            }

            nav a {

            }

            }

            .hero h1 {
                font-size: 1.2rem;
            }

            .grid {
                grid-template-columns: 1fr;

                padding:
                    0 20px 60px;

                gap: 25px;
            }

        }

    </style>
</head>

    <!-- =========================
         VIDEO PLAYER SCRIPT
    ========================== -->

    <script>

        const videos =
            document.querySelectorAll(".vimeo-video");


        videos.forEach(video => {

            video.addEventListener("click", function () {

                const videoID =
                    this.dataset.video;

                const hash =
                    this.dataset.hash;


                let videoURL =
                    "https://player.vimeo.com/video/" +
                    videoID +
                    "?autoplay=1&title=0&byline=0&portrait=0";


                if (hash) {

                    videoURL =
                        "https://player.vimeo.com/video/" +
                        videoID +
                        "?h=" +
                        hash +
                        "&autoplay=1&title=0&byline=0&portrait=0";

                }


                this.innerHTML = `

                    <iframe
                        src="${videoURL}"
                        allow="autoplay; fullscreen; picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            });

        });

    </script>
