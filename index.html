<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>people films</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0b0b0b; color: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 50px; border-bottom: 1px solid #1a1a1a; }
        .logo { font-size: 1.2rem; font-weight: 300; letter-spacing: 2px; color: #fff; }
        nav a { color: #888; text-decoration: none; margin-left: 30px; font-size: 0.9rem; transition: color 0.3s; }
        nav a:hover { color: #fff; }
        
        .hero { text-align: center; padding: 80px 20px 60px 20px; max-width: 900px; margin: 0 auto; }
        .hero h1 { font-size: 2.2rem; font-weight: 400; line-height: 1.5; letter-spacing: -0.5px; color: #e0e0e0; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; padding: 0 50px 80px 50px; max-width: 1400px; margin: 0 auto; }
        .video-card { background: #141414; border-radius: 4px; overflow: hidden; border: 1px solid #222; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-info { padding: 15px 20px; }
        .video-info h3 { font-size: 1rem; font-weight: 500; color: #ddd; }

        footer { text-align: center; padding: 40px; color: #666; font-size: 0.85rem; border-top: 1px solid #1a1a1a; }

        @media(max-width: 768px) {
            header { padding: 20px; }
            .hero { padding: 40px 20px; }
            .hero h1 { font-size: 1.5rem; }
            .grid { padding: 0 20px 40px 20px; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">people films.</div>
        <nav>
            <a href="#">Reel</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>specialize in narrative but produce everything.</h1>
    </section>

    <div class="grid">
        <!-- Örnek Video 1 -->
        <div class="video-card">
            <div class="video-container">
                <iframe src="https://player.vimeo.com/video/1196732175" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <h3>Commercial Project 01</h3>
            </div>
        </div>

        <!-- Örnek Video 2 -->
        <div class="video-card">
            <div class="video-container">
                <iframe src="https://player.vimeo.com/video/1218850577" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <h3>Documentary Cut</h3>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 people films.
    </footer>

</body>
</html>
