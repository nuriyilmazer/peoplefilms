<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>people films</title>
    <style>
        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #0b0b0b; 
            color: #f4f4f4; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow-x: hidden; 
            line-height: 1.6;
        }

        /* --- HEADER --- */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 30px 50px; 
            border-bottom: 1px solid #1a1a1a; 
            background-color: #0b0b0b;
        }

        .logo { 
            font-size: 1.1rem; 
            letter-spacing: 1.5px; 
            color: #fff; 
            text-decoration: none;
            font-weight: 500;
        }

        nav a { 
            color: #888; 
            text-decoration: none; 
            margin-left: 30px; 
            font-size: 0.85rem; 
            transition: color 0.3s; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover { color: #fff; }
        
        /* --- HERO (LOGLINE) --- */
        .hero { 
            text-align: center; 
            padding: 100px 20px 80px 20px; 
            max-width: 900px; 
            margin: 0 auto; 
        }

        .hero h1 { 
            font-size: 1.4rem; 
            font-weight: 300; 
            line-height: 1.6; 
            letter-spacing: -0.3px; 
            color: #e0e0e0; 
        }
        
        /* --- VIDEO GRID --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); 
            gap: 40px; 
            padding: 0 50px 100px 50px; 
            max-width: 1600px; 
            margin: 0 auto; 
        }

        .video-card { 
            background: transparent; 
            overflow: hidden; 
        }

        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0; 
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        .video-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }

        /* --- ÖZEL THUMBNAIL VE HOVER EFEKTİ (Instagram için) --- */
        .custom-thumb-link {
            display: block;
            text-decoration: none;
            overflow: hidden;
        }

        .thumb-container {
            position: relative;
            background-color: #111;
        }

        .thumb-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        .thumb-container:hover img {
            transform: scale(1.03);
            filter: brightness(0.8);
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .thumb-container:hover .play-overlay {
            opacity: 1;
        }

        .play-overlay span {
            color: #fff;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #fff;
            padding-bottom: 4px;
        }

        /* --- FOOTER --- */
        footer { 
            text-align: center; 
            padding: 60px 50px; 
            color: #555; 
            font-size: 0.8rem; 
            border-top: 1px solid #1a1a1a; 
            background-color: #090909;
            letter-spacing: 0.5px;
        }

        /* --- MOBILE RESPONSIVE --- */
        @media(max-width: 768px) {
            header { padding: 20px; }
            .logo { font-size: 1rem; }
            nav a { margin-left: 15px; font-size: 0.75rem; }
            .hero { padding: 60px 20px; }
            .hero h1 { font-size: 1.2rem; line-height: 1.5; }
            .grid { padding: 0 20px 60px 20px; grid-template-columns: 1fr; gap: 30px; }
            .video-container { box-shadow: none; }
        }
    </style>
</head>
