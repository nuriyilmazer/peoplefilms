        /* ========================================
           RESET
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

                Arial,
                sans-serif;

            overflow-x: hidden;

            line-height: 1.6;

        }



        /* ========================================
           HEADER
        ======================================== */

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 30px 50px;

            border-bottom: 1px solid #1a1a1a;

            background-color: #0b0b0b;

        }


        .logo {

            font-size: 1.1rem;

            letter-spacing: 1.5px;

            color: #fff;

            text-decoration: none;

            font-weight: 500;

        }


        nav a {

            color: #888;

            text-decoration: none;

            margin-left: 30px;

            font-size: 0.85rem;

            text-transform: uppercase;

            letter-spacing: 1px;

            transition: color 0.3s ease;

        }


        nav a:hover {

            color: #fff;

        }



        /* ========================================
           HERO
        ======================================== */

        .hero {

            text-align: center;

            padding: 100px 20px 80px;

            max-width: 900px;

            margin: 0 auto;

        }


        .hero h1 {

            font-size: 1.4rem;

            font-weight: 300;

            line-height: 1.6;

            letter-spacing: -0.3px;

            color: #e0e0e0;

        }



        /* ========================================
           GRID
        ======================================== */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 40px;

            padding: 0 50px 100px;

            max-width: 1600px;

            margin: 0 auto;

        }



        /* ========================================
           VIDEO CARD
        ======================================== */

        .video-card {

            width: 100%;

            min-width: 0;

        }



        /* ========================================
           MEDIA BOX

           EVERY CARD IS 16:9
        ======================================== */

        .media-box {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background-color: #111;

            cursor: pointer;

        }



        /* ========================================
           THUMBNAILS
        ======================================== */

        .thumbnail {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;

            transition:
                transform 0.6s ease,
                filter 0.4s ease;

        }



        /* ========================================
           HOVER
        ======================================== */

        .media-box:hover .thumbnail {

            transform: scale(1.025);

            filter: brightness(0.65);

        }



        /* ========================================
           WATCH
        ======================================== */

        .watch {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #fff;

            font-size: 0.78rem;

            font-weight: 400;

            letter-spacing: 2px;

            text-transform: uppercase;

            opacity: 0;

            transition: opacity 0.3s ease;

            pointer-events: none;

            z-index: 2;

        }


        .media-box:hover .watch {

            opacity: 1;

        }



        /* ========================================
           VIMEO PLAYER
        ======================================== */

        .media-box iframe {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            border: 0;

            z-index: 10;

            background: #000;

        }



        /* ========================================
           INSTAGRAM
        ======================================== */

        .instagram-link {

            display: block;

            width: 100%;

            text-decoration: none;

            color: inherit;

        }



        /* ========================================
           FOOTER
        ======================================== */

        footer {

            text-align: center;

            padding: 60px 50px;

            color: #555;

            font-size: 0.8rem;

            border-top: 1px solid #1a1a1a;

            background-color: #090909;

            letter-spacing: 0.5px;

        }



        /* ========================================
           TABLET
        ======================================== */

        @media (max-width: 1100px) {

            .grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

            }

        }



        /* ========================================
           MOBILE
        ======================================== */

            header {

                padding: 20px;

            }


            .logo {

            }

            }

                line-height: 1.5;

            }

                grid-template-columns: 1fr;

                padding: 0 20px 60px;

                gap: 25px;

            }

        }

</head>

    <!-- ========================================
         VIDEO PLAYER
    ========================================= -->

    <script>

        const videos =
            document.querySelectorAll(".vimeo-video");


        videos.forEach((video) => {

            video.addEventListener(
                "click",
                function () {


                    const videoID =
                        this.dataset.video;


                    const hash =
                        this.dataset.hash;


                    let parameters =
                        "autoplay=1" +
                        "&title=0" +
                        "&byline=0" +
                        "&portrait=0";


                    if (hash) {

                        parameters =
                            "h=" +
                            hash +
                            "&" +
                            parameters;

                    }


                    const videoURL =
                        "https://player.vimeo.com/video/" +
                        videoID +
                        "?" +
                        parameters;


                    this.innerHTML = `

                        <iframe
                            src="${videoURL}"
                            allow="autoplay; fullscreen; picture-in-picture"
                            allowfullscreen
                        ></iframe>

                    `;

                },
                { once: true }
            );

        });

    </script>
