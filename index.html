* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

}

header {

  background-color: #0b0b0b;
}

.logo {

  color: #fff;

  font-weight: 500;
}

nav a {
  color: #888;

  text-transform: uppercase;
  letter-spacing: 1px;
  transition: color .3s ease;
}

}

.hero {

  padding: 100px 20px 50px;

}

  font-size: 1.15rem;
  font-weight: 300;
  line-height: 1.6;
  letter-spacing: -.3px;
  color: #e0e0e0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 40px;
  padding: 0 50px 100px;
  max-width: 1600px;
  margin: 0 auto;
}

.video-card {
  width: 100%;
  min-width: 0;
}

.media-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  overflow: hidden;
  background-color: #111;
  cursor: pointer;
}

.thumbnail {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
  transition: transform .6s ease, filter .4s ease;
}

.media-box:hover .thumbnail {
  transform: scale(1.025);
  filter: brightness(.65);
}

.watch {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: .78rem;
  font-weight: 400;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity .3s ease;
  pointer-events: none;
  z-index: 2;
}

.media-box:hover .watch {
  opacity: 1;
}

.media-box iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  z-index: 10;
  background: #000;
}

.instagram-link {
  display: block;
  width: 100%;
  text-decoration: none;
  color: inherit;
}

/* REEL MODAL */

.reel-modal {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,.96);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px;
  opacity: 0;
  visibility: hidden;
  transition: opacity .35s ease, visibility .35s ease;
  z-index: 9999;
}

.reel-modal.active {
  opacity: 1;
  visibility: visible;
}

.reel-player {
  width: min(1200px, 90vw);
  aspect-ratio: 16/9;
  background: #000;
}

.reel-player iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.reel-close {
  position: absolute;
  top: 25px;
  right: 35px;
  background: none;
  border: 0;
  color: #fff;
  font-size: 38px;
  font-weight: 200;
  line-height: 1;
  cursor: pointer;
  opacity: .65;
  transition: opacity .2s ease;
}

.reel-close:hover {
  opacity: 1;
}

footer {
  text-align: center;
  padding: 60px 50px;
  color: #555;
  font-size: .8rem;
  border-top: 1px solid #1a1a1a;
  background-color: #090909;
  letter-spacing: .5px;
}

@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 768px) {

  header {
    padding: 20px;
  }

  .logo {
    font-size: 1rem;
  }

  nav a {
    margin-left: 15px;
    font-size: .7rem;
  }

  .hero {
    padding: 60px 20px 40px;
  }

  .hero h1 {
    font-size: 1rem;
    line-height: 1.5;
  }

  .grid {
    grid-template-columns: 1fr;
    padding: 0 20px 60px;
    gap: 25px;
  }

  .reel-modal {
    padding: 20px;
  }

  .reel-player {
    width: 100%;
  }

  .reel-close {
    top: 18px;
    right: 20px;
    font-size: 32px;
  }
}

</style>
</head>

<script>

/* GRID VIDEOS */

const videos = document.querySelectorAll(".vimeo-video");

videos.forEach((video) => {

  video.addEventListener("click", function () {

    const videoID = this.dataset.video;
    const hash = this.dataset.hash;

    let parameters = "autoplay=1&title=0&byline=0&portrait=0";

    if (hash) {
      parameters = "h=" + hash + "&" + parameters;
    }

    const videoURL =
      "https://player.vimeo.com/video/" + videoID + "?" + parameters;

    this.innerHTML = `
      <iframe
        src="${videoURL}"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
    `;

  }, { once: true });

});


/* REEL MODAL */

const reelButton = document.getElementById("reel-button");
const reelModal = document.getElementById("reel-modal");
const reelPlayer = document.getElementById("reel-player");
const reelClose = document.getElementById("reel-close");


function openReel() {

  reelPlayer.innerHTML = `
    <iframe
      src="https://player.vimeo.com/video/1229475510?h=27cc224175&autoplay=1&title=0&byline=0&portrait=0"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  `;

  reelModal.classList.add("active");

  document.body.style.overflow = "hidden";

}


function closeReel() {

  reelModal.classList.remove("active");

  reelPlayer.innerHTML = "";

  document.body.style.overflow = "";

}


reelButton.addEventListener("click", function(event) {

  event.preventDefault();

  openReel();

});


reelClose.addEventListener("click", closeReel);


reelModal.addEventListener("click", function(event) {

  if (event.target === reelModal) {
    closeReel();
  }

});


document.addEventListener("keydown", function(event) {

  if (event.key === "Escape" && reelModal.classList.contains("active")) {
    closeReel();
  }

});

</script>
